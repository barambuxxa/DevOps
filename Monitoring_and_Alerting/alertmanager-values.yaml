alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      telegram_api_url: https://api.telegram.org
    
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'telegram'
      routes:
      - match:
          severity: critical
        receiver: telegram-critical
        repeat_interval: 5m
      - match:
          severity: warning
        receiver: telegram-warning
        repeat_interval: 30m
    
    receivers:
    - name: 'telegram'
      telegram_configs:
      - bot_token: '8226541607:AAHTU69cBQ5hCTpWcSKkVMYbsU%%%%%%'
        chat_id: -510118%%%%%%
        parse_mode: 'HTML'
        message: '{{ range .Alerts }}<b>{{ .Status | toUpper }}</b> - {{ .Labels.alertname }}
{{- if .Labels.severity }}Severity: {{ .Labels.severity }}{{ end }}
{{- if .Labels.instance }}Instance: {{ .Labels.instance }}{{ end }}
{{- if .Annotations.summary }}Summary: {{ .Annotations.summary }}{{ end }}
{{- end }}'
    
    - name: 'telegram-critical'
      telegram_configs:
      - bot_token: '8226541607:AAHTU69cBQ5hCTpWcSKkVMYbsUcjc%%%%%%'
        chat_id: -510118%%%%%%
        parse_mode: 'HTML'
        message: '🚨 <b>CRITICAL ALERT</b> 🚨
{{ range .Alerts }}
<b>Alert:</b> {{ .Labels.alertname }}
<b>Severity:</b> {{ .Labels.severity }}
<b>Instance:</b> {{ .Labels.instance }}
<b>Summary:</b> {{ .Annotations.summary }}
<b>Description:</b> {{ .Annotations.description }}
{{ end }}'
    
    - name: 'telegram-warning'
      telegram_configs:
      - bot_token: '8226541607:AAHTU69cBQ5hCTpWcSKkVMYbsUc%%%%%%'
        chat_id: -51011%%%%%%
        parse_mode: 'HTML'
        message: '⚠️ <b>WARNING ALERT</b> ⚠️
{{ range .Alerts }}
<b>Alert:</b> {{ .Labels.alertname }}
<b>Severity:</b> {{ .Labels.severity }}
<b>Instance:</b> {{ .Labels.instance }}
<b>Summary:</b> {{ .Annotations.summary }}
{{ end }}'
    
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']
