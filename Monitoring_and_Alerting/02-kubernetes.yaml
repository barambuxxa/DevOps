apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: 02-kubernetes
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
  - name: pod-alerts
    rules:
    # Под не готов
    - alert: PodNotReady
      expr: |
        max by (namespace, pod) (
          kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
        )
      for: 5m
      labels:
        severity: warning
        category: application
      annotations:
        summary: "Пода не готов"
        description: |
          ⚠️ода не готов к работе
           Пода: {{ $labels.pod }}
          Namespace: {{ $labels.namespace }}
           Состояние: {{ $labels.phase }}

          Пода находится в состоянии {{ $labels.phase }} более 5 минут.
          Проверить: kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}
