base_packages:                  #Наименование пакетов для установки
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - tree
  - jq
  - git
  - ufw
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - git

timezone: "Europe/Moscow"         #Тайм-зона

ufw_ports:                        #Прописанные порты которые будут открыты
  - 22    # SSH
  - 6443  # Kubernetes API
  - 2379  # etcd
  - 10250 # Kubelet API
  - 10259 # kube-scheduler
  - 10257 # kube-controller-manager
  - 8080  # web
  - 7946
  - 30442
  - 32710
  - 8472  # VXLAN
  - 179   # BGP Calico
  - 9100  #Prometheus metrics
  - 10249 #Metrics

additional_ssh_keys:             #Pubkey хоста который тоже хочет подключиться к серверам
  - "ssh-rsa  grandauto\andrey.gurenich@gurenich_IT"
  - "ssh-rsa  sysadmin@AnsibleServer"
